name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release executable
        run: cargo build --release --verbose

      - name: Rename executable
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -eq "${{ github.ref_name }}") { $version = "0.1.0" }
          Copy-Item "target/release/pocket.exe" "pocket-$version-windows-x64.exe"
        shell: powershell

      - name: Upload Windows executable
        uses: actions/upload-artifact@v3
        with:
          name: pocket-windows-x64
          path: pocket-*-windows-x64.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: pocket-*-windows-x64.exe
          draft: false
          prerelease: false
          body: |
            ## Pocket Password Manager

            ### Windows Installation

            1. Download `pocket-*-windows-x64.exe`
            2. Run the executable
            3. Create your master password
            4. Start storing passwords securely!

            ### What's New
            - Secure AES-256-GCM encryption
            - Retro-minimal design
            - Local-only password storage

            ### System Requirements
            - Windows 10/11 (64-bit)
            - No additional dependencies required
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Create tarball
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ "$VERSION" = "${{ github.ref_name }}" ]; then VERSION="0.1.0"; fi
          tar -czf "pocket-$VERSION-linux-x64.tar.gz" -C target/release pocket README.md LICENSE

      - name: Upload Linux binary
        uses: actions/upload-artifact@v3
        with:
          name: pocket-linux-x64
          path: pocket-*.tar.gz

      - name: Add to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: pocket-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Add Rust targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build Intel binary
        run: cargo build --release --target x86_64-apple-darwin --verbose

      - name: Build Apple Silicon binary
        run: cargo build --release --target aarch64-apple-darwin --verbose

      - name: Create universal binary
        run: |
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/pocket \
            target/aarch64-apple-darwin/release/pocket \
            -output target/release/pocket
          echo "Universal binary created"
          lipo -info target/release/pocket

      - name: Create app bundle
        run: |
          cargo bundle --release || echo "Bundle creation skipped (icon missing)"

      - name: Create distribution tarball
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ "$VERSION" = "${{ github.ref_name }}" ]; then VERSION="0.1.0"; fi

          # Create tarball with binary
          tar -czf "pocket-$VERSION-macos-universal.tar.gz" \
            -C target/release pocket \
            -C ../../ README.md LICENSE MACOS_BUILD.md

      - name: Upload macOS binary
        uses: actions/upload-artifact@v3
        with:
          name: pocket-macos-universal
          path: pocket-*-macos-universal.tar.gz

      - name: Upload app bundle if exists
        if: hashFiles('target/release/bundle/osx/Pocket.app') != ''
        uses: actions/upload-artifact@v3
        with:
          name: pocket-macos-app
          path: target/release/bundle/osx/Pocket.app

      - name: Add to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            pocket-*-macos-universal.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
