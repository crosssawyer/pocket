[package]
name = "pocket"
version = "0.1.0"
edition = "2021"
authors = ["Pocket Team"]
description = "A minimalist, secure password manager with retro-inspired design"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1.7"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

# Build configuration
[[bin]]
name = "pocket"
path = "src/main.rs"

# macOS app bundle configuration
[package.metadata.bundle]
name = "Pocket"
identifier = "com.pocket.password-manager"
version = "0.1.0"
icon = ["assets/icon.icns"]
category = "Utility"
short_description = "Secure password manager"
long_description = "A minimalist, secure password manager with retro-inspired design. Features AES-256-GCM encryption, Argon2 key derivation, and a beautiful minimal interface."
copyright = "Copyright (c) 2026 Pocket Team"
osx_minimum_system_version = "10.13"
